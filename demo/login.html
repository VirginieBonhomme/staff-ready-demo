<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login · Peaches</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .login-page-wrap {
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .login-card {
      width: 100%;
      max-width: 560px;
    }
    .login-eyebrow {
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--brand-accent);
      display: block;
      margin-bottom: 14px;
    }
    .login-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.8rem;
      font-weight: 400;
      line-height: 1.05;
      margin-bottom: 10px;
    }
    .login-sub {
      font-size: .88rem;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 40px;
    }
    .login-sections {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    @media (min-width: 520px) {
      .login-sections { grid-template-columns: 1fr 1fr; }
    }
    .login-section {
      background: var(--bg-card);
      padding: 28px 24px;
    }
    .login-section-label {
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }
    .login-section-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--text-main);
      display: block;
      margin-bottom: 20px;
    }
    .login-input-row {
      display: flex;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }
    .login-input {
      flex: 1;
      border: none;
      background: #fff;
      padding: 13px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      color: var(--text-main);
      outline: none;
      min-width: 0;
    }
    .login-input::placeholder { color: var(--border); }
    .login-btn {
      background: var(--brand-primary);
      color: #fff;
      border: none;
      padding: 13px 20px;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity .2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .login-btn:hover { opacity: .82; }
    .login-btn-accent { background: var(--brand-accent); }
    .login-error {
      display: block;
      font-size: .75rem;
      color: #872929;
      min-height: 18px;
      margin-top: 10px;
      letter-spacing: .02em;
    }
    .login-hint {
      font-size: .75rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.55;
    }
    .login-section-divider {
      display: none;
      width: 1px;
      background: var(--border);
    }
    @media (min-width: 520px) {
      .login-section-divider { display: block; }
    }
  </style>
</head>
<body>

<nav id="main-nav">
  <div class="wrap">
    <a class="nav-logo" href="index.html">Peaches</a>
    <button class="nav-burger" id="burger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="login-page-wrap">
  <div class="login-card">

    <span class="login-eyebrow">Peaches</span>
    <h1 class="login-heading">Staff Access</h1>
    <p class="login-sub">Enter your team password to continue. Front of house and back of house have separate access.</p>

    <div class="login-sections">
      <div class="login-section">
        <span class="login-section-label">Team</span>
        <span class="login-section-name">Front of House</span>
        <div class="login-input-row">
          <input class="login-input" type="password" id="foh-pw" placeholder="Password" autocomplete="off" autocapitalize="none">
          <button class="login-btn" id="foh-btn">Enter</button>
        </div>
        <span class="login-error" id="foh-err"></span>
      </div>
      <div class="login-section">
        <span class="login-section-label">Team</span>
        <span class="login-section-name">Back of House</span>
        <div class="login-input-row">
          <input class="login-input" type="password" id="boh-pw" placeholder="Password" autocomplete="off" autocapitalize="none">
          <button class="login-btn login-btn-accent" id="boh-btn">Enter</button>
        </div>
        <span class="login-error" id="boh-err"></span>
      </div>
    </div>

    <p class="login-hint">Ask your manager if you don&rsquo;t have your team password.</p>

  </div>
</div>

<script>
  const burger = document.getElementById('burger');
  const nav = document.getElementById('main-nav');
  burger.addEventListener('click', () => {
    burger.classList.toggle('open');
    nav.classList.toggle('open');
  });

  const PASSWORDS = { foh: 'foh pass', boh: 'boh pass' };

  function tryLogin(role) {
    const input = document.getElementById(role + '-pw');
    const error = document.getElementById(role + '-err');
    const val = input.value.trim().toLowerCase();

    if (val === PASSWORDS[role]) {
      sessionStorage.setItem('hhRole', role);
      const ret = sessionStorage.getItem('hhReturn');
      sessionStorage.removeItem('hhReturn');
      if (role === 'boh' && ret) {
        window.location.replace(ret);
      } else {
        window.location.replace('index.html');
      }
    } else {
      error.textContent = 'Incorrect password. Try again.';
      input.value = '';
      input.focus();
    }
  }

  document.getElementById('foh-btn').addEventListener('click', () => tryLogin('foh'));
  document.getElementById('boh-btn').addEventListener('click', () => tryLogin('boh'));

  document.getElementById('foh-pw').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryLogin('foh');
    document.getElementById('foh-err').textContent = '';
  });
  document.getElementById('boh-pw').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryLogin('boh');
    document.getElementById('boh-err').textContent = '';
  });
</script>

</body>
</html>
